<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ธรรมรัตน์  ไพลสาลี</title>

  <style>
    /* CSS อยู่ในไฟล์นี้ทั้งหมด แก้ได้ตามใจ ไม่กระทบใคร */
    body {
      margin: 0;
      padding: 3rem 1.5rem;
      background: #0d1c18;
      color: #e6ece8;
      font-family: "IBM Plex Sans Thai", -apple-system, "Segoe UI", sans-serif;
      line-height: 1.7;
    }

    .card {
      max-width: 34rem;
      margin: 0 auto;
      padding: 2rem;
      border: 1px solid #23423a;
      border-radius: 4px;
      background: #12241f;
    }

    h1 { margin: 0 0 0.3rem; font-size: 1.7rem; }

    .meta { margin: 0 0 1.5rem; color: #7d948b; font-size: 0.9rem; }

    ul { padding-left: 1.2rem; }

    a { color: #c9a227; }
  </style>
</head>
<body>

  <div class="card">
    <h1>ชื่อ นามสกุล</h1>
    <p class="meta">รหัสนักศึกษา · วิศวกรรมคอมพิวเตอร์</p>

    <p>เขียนแนะนำตัวสั้น ๆ สองถึงสามบรรทัด</p>

    <h2>สิ่งที่สนใจ</h2>
    <ul>
      <li>หัวข้อที่หนึ่ง</li>
      <li>หัวข้อที่สอง</li>
      <li>หัวข้อที่สาม</li>
    </ul>

    <p><a href="../index.html">กลับไปหน้าผนัง</a></p>
  </div>

</body>
</html>
